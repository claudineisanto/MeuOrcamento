name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve GitHub Pages base URL
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER}"

          if [ "$REPO_NAME" = "${OWNER}.github.io" ]; then
            echo "EXPO_PUBLIC_BASE_URL=" >> "$GITHUB_ENV"
            echo "SITE_URL=https://${OWNER}.github.io/" >> "$GITHUB_ENV"
          else
            echo "EXPO_PUBLIC_BASE_URL=/${REPO_NAME}" >> "$GITHUB_ENV"
            echo "SITE_URL=https://${OWNER}.github.io/${REPO_NAME}/" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build Expo web for GitHub Pages
        run: npm run build:web:github

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
